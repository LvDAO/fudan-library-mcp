[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fudan-library-mcp"
version = "0.1.0"
description = "Search Fudan Library Primo, including indexed full text, through MCP"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "LvDAO" }]
keywords = ["mcp", "fudan", "library", "literature", "primo", "full-text-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Indexing",
]
dependencies = ["mcp>=1.26,<2", "httpx>=0.28,<0.29", "pydantic>=2.11,<3"]

[project.urls]
Homepage = "https://github.com/LvDAO/fudan-library-mcp"
Repository = "https://github.com/LvDAO/fudan-library-mcp"
Issues = "https://github.com/LvDAO/fudan-library-mcp/issues"
Changelog = "https://github.com/LvDAO/fudan-library-mcp/blob/main/CHANGELOG.md"

[project.scripts]
fudan-library-mcp = "fudan_library_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/fudan_library_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/scripts", "/examples", "/docs", "/README.md",
    "/LICENSE", "/CHANGELOG.md", "/pyproject.toml", "/uv.lock",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
