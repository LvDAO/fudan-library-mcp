name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uv run --frozen ruff check src tests scripts
      - run: uv run --frozen ruff format --check src tests scripts
      - run: uv run --frozen pytest -q
      - run: uv build
      - name: Validate tag, distribution contents, and checksums
        run: uv run --frozen python scripts/check_dist.py
      - name: Verify installed wheel through MCP
        run: |
          wheel=(dist/*.whl)
          uv run --frozen python scripts/verify_install.py --from "${wheel[0]}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag --generate-notes --title "Fudan Library MCP $GITHUB_REF_NAME"
